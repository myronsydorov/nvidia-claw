[project]
name = "warden"
version = "0.1.0"
description = "Custody host service: FastAPI app API, MCP server, scheduler, SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiosqlite>=0.22.1",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0",
    "httpx2>=0.1",  # NVIDIA Build client (T-09); same HTTP client as watcher_runtime
]

[dependency-groups]
test = ["watcher_runtime"]

[tool.uv.sources]
watcher_runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]
