[tool.uv.workspace]
members = ["warden", "relay", "watcher_runtime"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "httpx2>=0.1", "pytest-asyncio>=0.24"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
