[project]
name = "watcher_runtime"
version = "0.1.0"
description = "Custody watcher runtime: base image, run harness and adapter library imported by watchers"
requires-python = ">=3.12"
dependencies = ["httpx2>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_runtime"]
