# Custody watcher policy for cw-parcel-dhl1: generated from adapter declarations
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  read_write:
  - /tmp
  - /dev/null
  - /sandbox
  - /w
landlock:
  compatibility: strict
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  custody_api_eu_dhl_com_443:
    name: custody_api_eu_dhl_com_443
    endpoints:
    - host: api-eu.dhl.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /track/shipments
    binaries:
    - path: /usr/local/bin/python3.12
